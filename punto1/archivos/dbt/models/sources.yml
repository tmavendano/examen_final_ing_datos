version: 2
sources:
  - name: ventas_raw
    schema: raw
    tables:
      - name: ventas
        loaded_at_field: _loaded_at              # columna con el instante de carga
        freshness:
          warn_after: {count: 12, period: hour}  # más de 12 h: advertencia
          error_after: {count: 24, period: hour} # más de 24 h: error
        columns:
          - name: id_venta
            tests: [unique, not_null]
          - name: fecha_venta
            tests: [not_null]
          - name: cantidad
            tests: [not_null]
          - name: precio_unitario
            tests: [not_null]
          - name: _loaded_at
            tests: [not_null]
